name: Deploy frontend to Cloudflare

# Deploys the frontend when frontend-related files change on main. The merged
# commit is re-checked with Frontend CI first; the deploy job runs only if it
# passes. Workers Builds must NOT also deploy production (see docs/ARCHITECTURE.md).
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a rollout.
concurrency:
  group: frontend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/frontend-ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production-frontend
      url: https://gopackage-chronicle.anphse.workers.dev
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # PUBLIC_API_BASE_URL is baked into the static bundle at build time.
      - name: Build
        env:
          PUBLIC_API_BASE_URL: https://gopackage-chronicle.fly.dev
        run: bun run build

      # Wrangler deploys show as "Manually deployed" in the dashboard with no git
      # info, so label each one with the commit subject (message) and short SHA
      # (tag). Read from git rather than the event payload so manual runs get it
      # too. For a GitHub merge commit the subject is "Merge pull request #N from
      # ..." and the PR title is the first body line, so use that instead. The
      # message is cut to 100 characters to stay under Cloudflare's limit.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          message="$(git log -1 --format=%s)"
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]; then
            title="$(git log -1 --format=%b | sed -n '/./{p;q;}')"
            message="${title:-$message}"
          fi
          message="$(printf '%s' "$message" | cut -c1-100)"
          tag="$(git rev-parse --short HEAD)"
          bunx wrangler deploy --message "$message" --tag "$tag"

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null https://gopackage-chronicle.anphse.workers.dev/
