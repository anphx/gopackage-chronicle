name: Deploy frontend to Cloudflare

# Builds and deploys the frontend to Cloudflare Workers after Frontend CI passes.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

# Runs one deploy at a time and queues newer runs.
concurrency:
  group: frontend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/frontend-ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production-frontend
      url: https://gopackage-chronicle.anphse.workers.dev
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Embeds PUBLIC_API_BASE_URL into the static bundle.
      - name: Build
        env:
          PUBLIC_API_BASE_URL: https://gopackage-chronicle.fly.dev
        run: bun run build

      # Deploys with the commit subject as the message (the PR title for a merge
      # commit, up to 100 characters) and the short SHA as the tag.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          message="$(git log -1 --format=%s)"
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]; then
            title="$(git log -1 --format=%b | sed -n '/./{p;q;}')"
            message="${title:-$message}"
          fi
          message="$(printf '%s' "$message" | cut -c1-100)"
          tag="$(git rev-parse --short HEAD)"
          bunx wrangler deploy --message "$message" --tag "$tag"

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 --output /dev/null https://gopackage-chronicle.anphse.workers.dev/
