name: Frontend CI

# No path filter on purpose: this check is meant to be a required status check,
# and a required check that never runs (PR doesn't touch frontend/) blocks the
# merge forever. The job takes about a minute.
on:
  pull_request:
  workflow_dispatch:
  # Called by frontend-deploy.yml so the merged commit is re-checked before deploying.
  workflow_call:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Same Bun version as the deploy and preview workflows.
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Build
        env:
          # Placeholder: only proves the build works; nothing is deployed.
          PUBLIC_API_BASE_URL: https://gopackage-chronicle.fly.dev
        run: bun run build

      - name: Validate Wrangler config
        run: bunx wrangler deploy --dry-run

      # Browsers are cached per Playwright version; system libraries are installed every run.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # The tests mock every API call, so no backend is needed.
      - name: E2E tests
        run: bun run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
