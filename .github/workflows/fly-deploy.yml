name: Deploy API to Fly.io

# Deploys the API when backend-related files change on main. The merged commit
# is re-checked with Backend CI first; the deploy job runs only if every check
# job passes.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/Dockerfile.backend'
      - 'fly.toml'
      - '.dockerignore'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/fly-deploy.yml'
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a rollout.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/backend-ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gopackage-chronicle.fly.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      # Builds infra/Dockerfile.backend on Fly's remote builder (see fly.toml)
      # and waits for the /health check before finishing.
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 https://gopackage-chronicle.fly.dev/health
