# Fly.io config for the API server. Deploy from the repo root with `fly deploy`.
# See https://docs.fly.io/reference/configuration
# Secrets (POSTGRES_*, ALLOWED_ORIGINS) are set with `fly secrets set`, not here.

app = 'gopackage-chronicle'
# London: closest Fly region to Supabase (eu-west-1, Ireland).
primary_region = 'lhr'

[build]
  # Same Dockerfile docker-compose and Backend CI build.
  dockerfile = 'infra/Dockerfile.backend'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Lets Fly mark a crash-looping release as unhealthy instead of serving
  # proxy timeouts. The server exits at startup if it can't reach the DB.
  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  # A Go JSON API needs far less than the 1GB Fly Launch picked.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
